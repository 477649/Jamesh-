name: Chukul Floorsheet Daily (3:30 PM NPT)

on:
  schedule:
    # 03:30 PM Nepal Time (UTC +5:45)
    # 15:30 NPT = 09:45 UTC
    - cron: "45 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-floorsheet
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # dashboard publish needs these (safe even if already in requirements.txt)
          pip install pandas openpyxl

      - name: Run floorsheet scraper
        run: |
          python scrape_chukul_floorsheet.py

      - name: Generate Market Overview Report
        run: |
          python scripts/generate_market_report.py

      - name: Build dashboard data (docs/data)
        run: |
          python tools/publish_to_pages.py

      - name: Commit and push all outputs (floorsheet + reports + dashboard data)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Add everything produced
          git add outputs/*.xlsx outputs/reports/*.xlsx docs/data/index.json docs/data/*.csv || true

          # Commit if there are changes
          git commit -m "Daily floorsheet + reports + dashboard data (3:30 PM NPT)" || echo "No changes to commit"

          # Sync & push once
          git pull --rebase origin main
          git push origin main
