name: Chukul Floorsheet Daily (3:30 PM NPT)

on:
  schedule:
    # 03:30 PM Nepal Time (UTC +5:45)
    # 15:30 NPT = 09:45 UTC
    # Run Sunday-Thursday only
    - cron: "45 9 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-floorsheet
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run floorsheet scraper
        run: |
          python scrape_chukul_floorsheet.py

      - name: Run ShareSansar today share price scraper
        run: |
          python scripts/sharesansar_today_share_price.py

      - name: Generate Market Overview Report
        run: |
          python scripts/generate_market_report.py

      - name: Generate PriceAction Signals
        run: |
          python priceaction_signals.py

      - name: Send email summary
        run: |
          python scripts/send_email_summary.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Commit and push daily output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add outputs/*.xlsx outputs/reports/*.xlsx outputs/sharesansar/*.csv "outputs/Floor Sheet/*.csv" outputs/PriceAction/*.xlsx || true

          git commit -m "Daily floorsheet + market overview + price action report (3:30 PM NPT)" || echo "No changes to commit"

          git pull --rebase origin main
          git push origin main
