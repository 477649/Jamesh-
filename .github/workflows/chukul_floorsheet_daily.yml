name: Chukul Floorsheet Daily (3:30 PM NPT)

on:
  schedule:
    # 03:30 PM Nepal Time (UTC +5:45)
    # 15:30 NPT = 09:45 UTC
    - cron: "45 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run floorsheet scraper
        run: |
          python scrape_chukul_floorsheet.py

      - name: Commit and push daily output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add outputs/*.xlsx || true
          git commit -m "Daily floorsheet output (3:30 PM NPT)" || echo "No changes to commit"
          git push
