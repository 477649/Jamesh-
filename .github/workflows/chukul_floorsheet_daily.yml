name: Chukul Floorsheet Daily (3:30 PM NPT)

on:
  schedule:
    # 03:30 PM Nepal Time (UTC +5:45)
    # 15:30 NPT = 09:45 UTC
    - cron: "45 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

# ✅ Prevent multiple workflow runs from pushing at the same time
concurrency:
  group: daily-floorsheet
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ✅ important for pull/rebase to work properly

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ✅ for publish script (safe even if already in requirements)
          pip install pandas openpyxl

      # ✅ IMPORTANT: sync BEFORE generating any new files (prevents "unstaged changes" rebase error)
      - name: Sync with remote (pull --rebase)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull --rebase origin main

      - name: Run floorsheet scraper
        run: |
          python scrape_chukul_floorsheet.py

      - name: Generate Market Overview Report
        run: |
          python scripts/generate_market_report.py

      # ===============================
      # 📊 Publish data for GitHub Pages dashboard
      # ===============================
      - name: Build dashboard data (docs/data)
        run: |
          python tools/publish_to_pages.py

      # ✅ Commit everything once, push once (no pull after generating files)
      - name: Commit and push all outputs (floorsheet + reports + dashboard data)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Add floorsheet + report outputs + dashboard data
          git add outputs/*.xlsx outputs/reports/*.xlsx docs/data/index.json docs/data/*.csv || true

          # Commit if there are changes
          git commit -m "Daily floorsheet + reports + dashboard data (3:30 PM NPT)" || echo "No changes to commit"

          # Push (no pull here)
          git push origin main
