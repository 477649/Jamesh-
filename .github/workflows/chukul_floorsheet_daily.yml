name: Chukul Floorsheet Daily (3:30 PM NPT)

on:
  schedule:
    # 03:30 PM Nepal Time (UTC +5:45)
    # 15:30 NPT = 09:45 UTC
    - cron: "45 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

# ✅ Prevent multiple workflow runs from pushing at the same time
concurrency:
  group: daily-floorsheet
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ Ensure Chrome exists (for floorsheet Selenium only)
      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # 1️⃣ Floorsheet scraper (UNCHANGED)
      - name: Run floorsheet scraper
        run: |
          python scrape_chukul_floorsheet.py

      # 2️⃣ NEPSE official today share price (API)
      - name: Run NEPSE today share price fetcher
        run: |
          python scripts/fetch_today_price.py

      # 3️⃣ Market overview report
      - name: Generate Market Overview Report
        run: |
          python scripts/generate_market_report.py

      # 4️⃣ Commit and push daily outputs
      - name: Commit and push daily output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Floorsheet + NEPSE today price + reports
          git add \
            outputs/share_price/*.csv \
            outputs/*.xlsx \
            outputs/reports/*.xlsx \
            "outputs/Floor Sheet/*.csv" || true

          git commit -m "Daily floorsheet + NEPSE today price (3:30 PM NPT)" || echo "No changes to commit"

          git pull --rebase origin main
          git push origin main

      # ===============================
      # 📊 Publish data for GitHub Pages dashboard
      # ===============================

      - name: Install dashboard publish dependencies
        run: |
          pip install pandas openpyxl

      - name: Build dashboard data (docs/data)
        run: |
          python tools/publish_to_pages.py

      - name: Commit and push dashboard data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/index.json docs/data/*.csv || true
          git commit -m "Update dashboard data for GitHub Pages" || echo "No dashboard changes"

          git pull --rebase origin main
          git push origin main
