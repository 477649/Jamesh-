name: Chukul Floorsheet Daily (3:30 PM NPT)

on:
  schedule:
    # 03:30 PM Nepal Time (UTC +5:45)
    # 15:30 NPT = 09:45 UTC
    # ✅ Run Sunday–Thursday ONLY (skip Friday & Saturday)
    - cron: "45 9 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

# ✅ Prevent multiple workflow runs from pushing at the same time
concurrency:
  group: daily-floorsheet
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ✅ important for pull/rebase to work properly

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ NEW (recommended): Ensure Chrome exists on runner for Selenium
      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # 1️⃣ Floorsheet first
      - name: Run floorsheet scraper
        run: |
          python scrape_chukul_floorsheet.py

      # 2️⃣ ShareSansar today share price
      - name: Run ShareSansar today share price scraper
        run: |
          python scripts/sharesansar_today_share_price.py

      # 3️⃣ Market overview report
      - name: Generate Market Overview Report
        run: |
          python scripts/generate_market_report.py

      # 4️⃣ PriceAction early accumulation / distribution signals
      - name: Generate PriceAction Signals
        run: |
          python priceaction_signals.py

      # 5️⃣ Commit and push all daily outputs
      - name: Commit and push daily output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Add floorsheet + sharesansar + reports + Floor Sheet CSV folder + PriceAction
          git add outputs/*.xlsx outputs/reports/*.xlsx outputs/sharesansar/*.csv "outputs/Floor Sheet/*.csv" outputs/PriceAction/*.xlsx || true

          # Commit if there are changes
          git commit -m "Daily floorsheet + market overview + price action report (3:30 PM NPT)" || echo "No changes to commit"

          # ✅ Fix push rejection: sync with remote then push
          git pull --rebase origin main
          git push origin main

      # ===============================
      # 📊 Publish data for GitHub Pages dashboard
      # ===============================

      - name: Install dashboard publish dependencies
        run: |
          pip install pandas openpyxl

      - name: Build dashboard data (docs/data)
        run: |
          python tools/publish_to_pages.py

      - name: Commit and push dashboard data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Add dashboard data only
          git add docs/data/index.json docs/data/*.csv || true

          # Commit if there are changes
          git commit -m "Update dashboard data for GitHub Pages" || echo "No dashboard changes"

          # Sync & push
          git pull --rebase origin main
          git push origin main
